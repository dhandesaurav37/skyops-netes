name: Build and Publish SkyOps Agent to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'agent/**'
      - '.github/workflows/agent-image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional custom version tag to apply (e.g. v1.4.2)'
        required: false
        default: 'v1.4.2'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dhandesaurav37/skyops-agent

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Run Go tests
        run: |
          go test -v -race ./...

      - name: Verify Go build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -trimpath -ldflags="-s -w" -o /tmp/skyops-agent ./cmd/skyops-agent

  build-and-push:
    name: Build & Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with Git Commit SHA
            type=sha,format=short,prefix=sha-
            # Tag with SemVer on tag pushes (v1.4.2, v1.4.3, v2.0.0, etc.)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag manual input if specified
            type=raw,value=${{ github.event.inputs.version_tag }},enable=${{ github.event.inputs.version_tag != '' }}
            # Default v1.4.2 release tag on main branch push
            type=raw,value=v1.4.2,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # Latest tag for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
